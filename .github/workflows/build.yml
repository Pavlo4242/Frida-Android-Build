name: build

on:
  workflow_dispatch:
    inputs:
      FRIDA_VERSION:
        description: 'FRIDA_VERSION'

jobs:
  android_build:
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        uses: actions/create-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ github.event.inputs.FRIDA_VERSION }}"
          release_name: "${{ github.event.inputs.FRIDA_VERSION }}"
          draft: false
          prerelease: false

      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 16

      - uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - uses: nttld/setup-ndk@v1.0.6
        id: setup-ndk
        with:
          ndk-version: r25b

      - uses: actions/setup-python@v2
        with:
          python-version: 3.9

      - name: install dependencies
        run: |
          sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison xz-utils ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 zip -y
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief

      - name: repository clone
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          git clone https://github.com/JsHookApp/Frida-Patchs Patchs
          git clone -b ${{ github.event.inputs.FRIDA_VERSION }} --recurse-submodules https://github.com/frida/frida frida
          cd frida/frida-core
          git am ../../Patchs/frida-core/*.patch

      - name: build frida for Android
        run: |
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          cd ./frida
          make core-android-arm
          make core-android-arm64
          make core-android-x86
          make core-android-x86_64

      - name: devkit frida for Android
        run: |
          cd ./frida
          python3 ./releng/devkit.py frida-gum android-arm devkit/frida-gum-arm
          python3 ./releng/devkit.py frida-gum android-arm64 devkit/frida-gum-arm64
          python3 ./releng/devkit.py frida-gum android-x86 devkit/frida-gum-x86
          python3 ./releng/devkit.py frida-gum android-x86_64 devkit/frida-gum-x86_64
          python3 ./releng/devkit.py frida-gumjs android-arm devkit/frida-gumjs-arm
          python3 ./releng/devkit.py frida-gumjs android-arm64 devkit/frida-gumjs-arm64
          python3 ./releng/devkit.py frida-gumjs android-x86 devkit/frida-gumjs-x86
          python3 ./releng/devkit.py frida-gumjs android-x86_64 devkit/frida-gumjs-x86_64

      - name: Create organized directory structure
        run: |
          mkdir -p frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-server
          mkdir -p frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-gadget
          mkdir -p frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gum
          mkdir -p frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gumjs
          
          # Copy frida-server binaries
          cp ${{ github.workspace }}/frida/build/frida-android-arm/bin/frida-server frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-server/android-arm/
          cp ${{ github.workspace }}/frida/build/frida-android-arm64/bin/frida-server frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-server/android-arm64/
          cp ${{ github.workspace }}/frida/build/frida-android-x86/bin/frida-server frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-server/android-x86/
          cp ${{ github.workspace }}/frida/build/frida-android-x86_64/bin/frida-server frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-server/android-x86_64/
          
          # Copy frida-gadget binaries
          cp ${{ github.workspace }}/frida/build/frida-android-arm/lib/frida/32/frida-gadget.so frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-gadget/android-arm/
          cp ${{ github.workspace }}/frida/build/frida-android-arm64/lib/frida/64/frida-gadget.so frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-gadget/android-arm64/
          cp ${{ github.workspace }}/frida/build/frida-android-x86/lib/frida/32/frida-gadget.so frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-gadget/android-x86/
          cp ${{ github.workspace }}/frida/build/frida-android-x86_64/lib/frida/64/frida-gadget.so frida-build-${{ github.event.inputs.FRIDA_VERSION }}/frida-gadget/android-x86_64/
          
          # Copy devkit files
          cp -r ${{ github.workspace }}/frida/devkit/frida-gum-arm/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gum/android-arm/
          cp -r ${{ github.workspace }}/frida/devkit/frida-gum-arm64/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gum/android-arm64/
          cp -r ${{ github.workspace }}/frida/devkit/frida-gum-x86/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gum/android-x86/
          cp -r ${{ github.workspace }}/frida/devkit/frida-gum-x86_64/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gum/android-x86_64/
          
          cp -r ${{ github.workspace }}/frida/devkit/frida-gumjs-arm/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gumjs/android-arm/
          cp -r ${{ github.workspace }}/frida/devkit/frida-gumjs-arm64/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gumjs/android-arm64/
          cp -r ${{ github.workspace }}/frida/devkit/frida-gumjs-x86/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gumjs/android-x86/
          cp -r ${{ github.workspace }}/frida/devkit/frida-gumjs-x86_64/* frida-build-${{ github.event.inputs.FRIDA_VERSION }}/devkit/frida-gumjs/android-x86_64/
          
          # Create README file
          cat > frida-build-${{ github.event.inputs.FRIDA_VERSION }}/README.md << EOF
          # Frida ${{ github.event.inputs.FRIDA_VERSION }} - Android Build
          
          This archive contains Frida binaries built for Android architectures.
          
          ## Directory Structure
          - `frida-server/` - Frida server binaries for each architecture
          - `frida-gadget/` - Frida gadget binaries for each architecture  
          - `devkit/frida-gum/` - Frida Gum devkit files
          - `devkit/frida-gumjs/` - Frida GumJS devkit files
          
          ## Architectures
          - android-arm (32-bit ARM)
          - android-arm64 (64-bit ARM)
          - android-x86 (32-bit x86)
          - android-x86_64 (64-bit x86)
          
          Built on: $(date)
          Frida Version: ${{ github.event.inputs.FRIDA_VERSION }}
          EOF

      - name: Create final archive
        run: |
          zip -r frida-android-${{ github.event.inputs.FRIDA_VERSION }}-complete.zip frida-build-${{ github.event.inputs.FRIDA_VERSION }}/

      - name: Upload complete archive to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: '${{ steps.create-release.outputs.upload_url }}'
          asset_name: 'frida-android-${{ github.event.inputs.FRIDA_VERSION }}-complete.zip'
          asset_path: '${{ github.workspace }}/frida-android-${{ github.event.inputs.FRIDA_VERSION }}-complete.zip'
          asset_content_type: application/zip
